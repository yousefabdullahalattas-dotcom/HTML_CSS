<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 3B - Greeting by Time</title>
  <style>
   
  </style>
</head>
<body>


 
  <input placeholder="Please enter your name" type="text" id="userName">
  <button onclick="greetByTime()">Greet Me</button>

  <div id="greeting" class="output"></div>

  <script>
    function greetByTime() {
      const hour = new Date().getHours();
      const name = document.getElementById("userName").value.trim();
      let greeting = "";

      if (name === "") {
        document.getElementById("greeting").innerText = "Please enter your name first.";
        return;
      }

      if (hour < 12) {
        greeting = "Good Morning";
      } else if (hour < 18) {
        greeting = "Good Afternoon";
      } else {
        greeting = "Good Evening";
      }

      document.getElementById("greeting").innerText = `${greeting}, ${name}!`;
    }
  </script>
</body>
</html>
